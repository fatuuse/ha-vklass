# Proposes a calendar event from a new Vklass news article, and creates it only after you tap "Create".
#
# Before you use it:
#  - Replace ai_task.your_ai_task with your AI Task entity (Settings -> Devices & services -> AI Task).
#  - Replace notify.mobile_app_your_phone with your notification service.
#  - Create a local calendar (integration "Local Calendar") and replace calendar.vklass_nyheter with it.
#  - Check the ai_task.generate_data fields against your Home Assistant version.
alias: Vklass - propose calendar event from news
description: Reads a new Vklass news article with AI and proposes an event. Creates it after you tap Create.
mode: queued
trigger:
  - platform: state
    entity_id: sensor.vklass_news_last_3_days
condition:
  - condition: template
    value_template: "{{ trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}"
  - condition: template
    value_template: "{{ state_attr('sensor.vklass_news_last_3_days', 'latest_text') | default('', true) | length > 0 }}"
variables:
  article_text: "{{ state_attr('sensor.vklass_news_last_3_days', 'latest_text') }}"
  article_url: "{{ state_attr('sensor.vklass_news_last_3_days', 'articles')[0].url }}"
action:
  - service: ai_task.generate_data
    target:
      entity_id: ai_task.your_ai_task
    data:
      task_name: vklass_event_from_news
      instructions: >-
        The text below is a school news article. If it announces a meeting, excursion, test or other event
        with a date and a start time, fill in the fields. If there is no such event, set has_event to false.
        If no end time is given, set end to one hour after start. Dates and times are in local time.
        Text:
        {{ article_text }}
      structure:
        has_event:
          selector:
            boolean: {}
        title:
          selector:
            text: {}
        start:
          selector:
            datetime: {}
        end:
          selector:
            datetime: {}
        location:
          selector:
            text: {}
    response_variable: proposal
  - condition: template
    value_template: "{{ proposal.data.has_event }}"
  - service: notify.mobile_app_your_phone
    data:
      title: "Proposed event from Vklass"
      message: "{{ proposal.data.title }}, {{ proposal.data.start }}"
      data:
        clickAction: "{{ article_url }}"
        actions:
          - action: VKLASS_CREATE
            title: Create
          - action: VKLASS_SKIP
            title: Skip
  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: VKLASS_CREATE
    timeout: "01:00:00"
    continue_on_timeout: false
  - service: calendar.create_event
    target:
      entity_id: calendar.vklass_nyheter
    data:
      summary: "{{ proposal.data.title }}"
      start_date_time: "{{ proposal.data.start }}"
      end_date_time: "{{ proposal.data.end }}"
      location: "{{ proposal.data.location }}"
      description: "Source: {{ article_url }}"
