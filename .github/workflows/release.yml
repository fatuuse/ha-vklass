name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Get version from tag
        id: get_version
        run: echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
      - name: Create zip file
        run: |
          cd custom_components/vklass
          zip vklass.zip -r .
      - name: Upload zip to release
        uses: softprops/action-gh-release@v3
        with:
          files: custom_components/vklass/vklass.zip
